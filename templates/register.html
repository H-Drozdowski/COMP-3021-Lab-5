{% extends "base.html" %}
{% block content %}
<div class="panel">
  <div class="panel-title">REGISTER NODE</div>
  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
      <label>USERNAME</label>
      <input type="text" name="username" autocomplete="off">
    </div>
    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" name="password">
    </div>
    <div class="form-group">
      <label>REGION</label>
      <input type="text" name="region" placeholder="e.g. Zone 1 North America" autocomplete="off">
    </div>
    <div class="btn-row">
      <button type="submit" class="btn">REGISTER</button>
    </div>
  </form>
</div>
{% endblock %}
