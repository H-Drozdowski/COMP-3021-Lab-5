{% extends "base.html" %}
{% block content %}
<div class="panel">
  <div class="panel-title">RENAME NODE</div>
  <p style="margin-bottom:14px;color:var(--grey);">Current name: <span style="color:var(--green);">{{ node.name }}</span></p>
  <form method="POST" action="{{ url_for('node_rename', node_id=node.id) }}">
    <div class="form-group">
      <label>NEW NAME</label>
      <input type="text" name="name" value="{{ node.name }}" autocomplete="off">
    </div>
    <div class="btn-row">
      <button type="submit" class="btn">RENAME</button>
      <a href="{{ url_for('node_view', node_id=node.id) }}" class="btn">CANCEL</a>
    </div>
  </form>
</div>
{% endblock %}
